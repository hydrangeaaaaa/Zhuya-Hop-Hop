<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f4f0ea" />
    <meta name="description" content="A small, hand-drawn endless runner." />
    <title>Little Runner</title>
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" type="image/png" href="assets/icons/icon-192.png" />
    <link rel="apple-touch-icon" href="assets/icons/icon-192.png" />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <main id="game-shell" class="game-shell" aria-label="Little Runner game">
      <canvas id="game-canvas" aria-label="Endless runner game canvas"></canvas>
      <div class="hud" aria-label="Game information">
        <div class="score-block">
          <span class="score-label">SCORE</span>
          <span id="score-value" class="score-number">00000</span>
        </div>
        <div class="score-block">
          <span class="score-label">BEST</span>
          <span id="best-value" class="score-number">00000</span>
        </div>
        <button id="sound-toggle" class="sound-toggle" type="button" aria-label="Turn sound off">🔊</button>
      </div>
      <p id="game-status" class="sr-only" aria-live="polite">Loading game.</p>
    </main>

    <script src="js/config.js"></script>
    <script src="js/audio.js"></script>
    <script src="js/player.js"></script>
    <script src="js/obstacles.js"></script>
    <script src="js/game.js"></script>
  </body>
</html>
